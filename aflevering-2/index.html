<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album tabel</title>
    <!-- Jeg tilføjer css fra Bootstrap.com--> 

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <!--Jeg tilføjer en div med tabellen indeni-->
    <div class="container mt-5">
        <h1>Album tabel</h1>

        <table class="table table-striped table-bordered">
            <!--I tablehead skriver jeg de 4 overskrifter som jeg trækker mine værdier fra i json-filen-->
            <thead>
                <tr>
                  <th>Artist</th>
                  <th>Album</th>
                  <th>Year</th>
                  <th>Rating</th>
                </tr>
              </thead>
              <!--I tablebody vil jeg gerne have indsat mine tablerows for hvert album, og giver den derfor id'et "album-listing", så jeg kan definere at det er her jeg vil sætte dem ind fra mit script-->
              <tbody id="album-listing">
    
              </tbody>
        </table>
    </div>
    <!--tilføjer bootstrap javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="albumScript.js"></script>
</body>
</html>
